<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DevTask Tracker - Gestor de tareas para desarrolladores">
    <title>DevTask Tracker | Gestor de Tareas</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="contenedor-app">
        <!-- cabecera principal -->
        <header class="cabecera">
            <div class="logo">
                <span class="icono-logo">&#60;/&#62;</span>
                <h1>DevTask Tracker</h1>
            </div>
            <p class="subtitulo">Organiza tus tareas de desarrollo</p>
        </header>

        <main class="contenido-principal">
            <!-- seccion del formulario -->
            <section class="seccion-formulario">
                <h2>Nueva Tarea</h2>
                <form id="formularioTarea" class="formulario">
                    <div class="grupo-campo">
                        <label for="inputTitulo">Título de la tarea</label>
                        <input type="text" id="inputTitulo" placeholder="Ej: Crear componente de login" required>
                    </div>

                    <div class="grupo-campo">
                        <label for="selectTecnologia">Tecnología</label>
                        <select id="selectTecnologia">
                            <option value="JavaScript">JavaScript</option>
                            <option value="Python">Python</option>
                            <option value="Java">Java</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="Node.js">Node.js</option>
                            <option value="MongoDB">MongoDB</option>
                            <option value="Express">Express</option>
                        </select>
                    </div>

                    <div class="grupo-campo">
                        <label for="selectEstado">Estado</label>
                        <select id="selectEstado">
                            <option value="pending">Pendiente</option>
                            <option value="done">Completada</option>
                        </select>
                    </div>

                    <button type="submit" class="boton-guardar">
                        <span class="icono-mas">+</span>
                        Guardar Tarea
                    </button>
                </form>
            </section>

            <!-- seccion donde se muestran las tareas -->
            <section class="seccion-tareas">
                <div class="cabecera-tareas">
                    <h2>Mis Tareas</h2>
                    <span id="contadorTareas" class="contador">0 tareas</span>
                </div>

                <!-- aqui se van a cargar las tareas dinamicamente -->
                <div id="contenedorTareas" class="grid-tareas">
                    <!-- las tareas se renderizan con javascript -->
                </div>

                <!-- mensaje cuando no hay tareas -->
                <div id="mensajeVacio" class="mensaje-vacio" style="display: none;">
                    <span class="icono-vacio">📋</span>
                    <p>No tienes tareas todavia</p>
                    <p class="texto-secundario">Crea tu primera tarea usando el formulario</p>
                </div>
            </section>
        </main>

        <!-- pie de pagina -->
        <footer class="pie-pagina">
            <p>Desarrollado por <strong>Marco Antonio Ochavo Fernández</strong> &copy; 2026</p>
            <p class="version">DevTask Tracker v1.0</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
